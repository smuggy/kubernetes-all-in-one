- name: Download K9s binary
  get_url:
    url: "https://github.com/derailed/k9s/releases/download/v{{ k9s_version }}/k9s_Linux_{{ k9s_arch }}.tar.gz"
    dest: "/tmp/k9s.tar.gz"
    mode: '0644'

- name: Create K9s installation directory if it doesn't exist
  file:
    path: "{{ k9s_install_dir }}"
    state: directory
    mode: '0755'

- name: Extract K9s binary
  unarchive:
    src: "/tmp/k9s.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Move K9s binary to installation directory
  copy:
    src: "/tmp/k9s"
    dest: "{{ k9s_install_dir }}/k9s"
    mode: '0755'
    remote_src: yes

- name: Clean up downloaded archive
  file:
    path: "/tmp/k9s.tar.gz"
    state: absent

- name: Clean up extracted binary
  file:
    path: "/tmp/k9s"
    state: absent

- name: copy test job
  copy:
    src: job.yaml
    dest: "/home/ubuntu/job.yaml"
    mode: "0644"
    owner: ubuntu
    group: ubuntu

